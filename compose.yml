services:
  ping-pong:
    # Use the auto-built GHCR image, or build locally with `docker compose build`.
    image: ghcr.io/faizoken/ping-pong:latest
    build: .
    container_name: ping-pong
    # Loads DISCORD_PUBLIC_KEY (and any other vars) from the local .env file.
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
