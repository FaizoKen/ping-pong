# Public traffic arrives through a Cloudflare Tunnel. cloudflared runs as its
# OWN container on the host (it also serves other tunnels), so it reaches the
# app container-to-container over this compose network (ping-pong_default).
# Attach it once with:
#
#   docker network connect ping-pong_default cloudflared
#
# Then point the tunnel's public hostname (Zero Trust dashboard -> Networks ->
# Tunnels -> Public Hostname) at  http://ping-pong:8080  — the container name
# and INTERNAL port, not a host port or 127.0.0.1. (Re-run the network connect
# if cloudflared is ever recreated.)

services:
  ping-pong:
    # Use the auto-built GHCR image, or build locally with `docker compose build`.
    image: ghcr.io/faizoken/ping-pong:latest
    build: .
    container_name: ping-pong
    # Loads DISCORD_PUBLIC_KEY (and any other vars) from the local .env file.
    env_file:
      - .env
    environment:
      PORT: "8080"
    # Reachable by cloudflared over the compose network as `ping-pong:8080`
    # (the tunnel ingress target — see header comment).
    expose:
      - "8080"
    # Loopback bind for on-box debugging and for host-networked Caddy; public
    # traffic arrives via the tunnel, so 8080 is never exposed to the internet.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    # Legacy direct-HTTPS path (kept for fallback/debugging): terminates TLS
    # for ping-us.faizo.net and reverse-proxies to ping-pong. Public traffic
    # normally arrives via the Cloudflare Tunnel instead.
    # host networking: Caddy binds host :80/:443 directly (no docker-proxy/NAT
    # hop) and its sockets to Discord use the host TCP stack (BBR + Fast Open).
    # It reaches the app via the loopback-published 127.0.0.1:8080.
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ping-pong

volumes:
  caddy_data:
  caddy_config:
