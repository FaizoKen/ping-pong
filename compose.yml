# Public traffic: point the `ping-us.faizo.net` DNS record at this host's IP,
# either "DNS only" (grey cloud — fastest, no Cloudflare hop) or "Proxied"
# (orange cloud — hides the origin IP; set the zone's SSL/TLS mode to
# "Full (strict)"). Caddy terminates TLS and routes by hostname (Caddyfile),
# so one box serves any number of subdomains/services — no tunnel needed.
#
# Alternative path (works, but measurably higher latency, and it disables
# the kernel-RTT "Webhook link" metric): a Cloudflare Tunnel. The bridge-
# networked cloudflared container cannot reach a host-networked loopback
# bind, so first swap the app's `network_mode: host` + `HOST` for
#   expose: ["8080"]
# then attach the host's standalone cloudflared once with
#   docker network connect ping-pong_default cloudflared
# and point the tunnel's public hostname (Zero Trust dashboard -> Networks ->
# Tunnels -> Public Hostname) at  http://ping-pong:8080  — the container name
# and INTERNAL port, never 127.0.0.1 (loopback inside the cloudflared
# container is cloudflared itself).

services:
  ping-pong:
    # Use the auto-built GHCR image, or build locally with `docker compose build`.
    image: ghcr.io/faizoken/ping-pong:latest
    build: .
    container_name: ping-pong
    # Loads DISCORD_PUBLIC_KEY (and any other vars) from the local .env file.
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Loopback-only bind: with host networking the app would otherwise
      # listen on the public interface; only Caddy needs to reach it.
      HOST: "127.0.0.1"
    # Shares the host network namespace so the app can read the kernel's
    # TCP_INFO (`ss -ti`) for the live connection Discord's webhook sender
    # holds to Caddy — that RTT is the "Webhook link" line in the /ping
    # report and is invisible from a bridge-networked container.
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    # Primary public path: terminates TLS for ping-us.faizo.net and
    # reverse-proxies to ping-pong. Works behind grey-cloud (direct) and
    # orange-cloud (proxied, SSL "Full (strict)") DNS alike.
    # host networking: Caddy binds host :80/:443 directly (no docker-proxy/NAT
    # hop) and its sockets to Discord use the host TCP stack (BBR + Fast Open).
    # It reaches the app via the loopback-published 127.0.0.1:8080.
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ping-pong

volumes:
  caddy_data:
  caddy_config:
